<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Singularity Webapp</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #000;
        color: #f3f6ff;
        font-family: "Space Grotesk", "IBM Plex Sans", "Segoe UI", sans-serif;
        transition: opacity 220ms ease;
      }

      #boot-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-loader-spinner {
        width: 52px;
        height: 52px;
        border-radius: 999px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: rgba(255, 216, 97, 0.95);
        animation: boot-spin 0.85s linear infinite;
      }

      .boot-loader-title {
        font-size: 0.98rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .boot-loader-subtitle {
        font-size: 0.82rem;
        opacity: 0.8;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite" aria-busy="true">
      <div class="boot-loader-spinner"></div>
      <div class="boot-loader-title">Loading Game</div>
      <div class="boot-loader-subtitle">Connecting to server...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
